name: kanbanboard

services:
  sqlserver:
    # The SQL Server 2022 image verified in PH-00 on this Mac.
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:${SQL_PORT:-3038}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    networks:
      - kanban-network

  api:
    image: kanbanboard-api:local
    build:
      context: .
      dockerfile: KanbanApi/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__Default: >-
        Server=sqlserver,1433;Database=${KANBAN_DATABASE:-KanbanDB};User Id=sa;Password="${MSSQL_SA_PASSWORD}";TrustServerCertificate=True;
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: "KanbanBoard.Api"
      Jwt__Audience: "KanbanBoard.Desktop"
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kanban-network

networks:
  kanban-network:

volumes:
  sqlserver-data:
